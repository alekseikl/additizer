[package]
name = "additizer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
arc-swap = "1.9.2"
egui = { version = "0.36.1", default-features = false, features = [
    "bytemuck",
    "default_fonts",
] }
egui_extras = { version = "0.36.1", default-features = false }
nice-plug = { version = "0.4.2", features = ["standalone"] }
nice-plug-egui = { version = "0.5.1", default-features = false, features = [
    "opengl",
] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
itertools = "0.15.0"
topo_sort = "0.4"
realfft = { version = "3.5" }
parking_lot = { version = "0.12.5", features = ["serde"] }
smallvec = "1.16.1"
assert_no_alloc = "1.1.2"
wide = "1.7.1"
const_format = "0.2.36"
directories = "6.0.0"
rtrb = "0.4.0"
rand = "0.10.2"
rand_pcg = "0.10.2"
rustc-hash = "2.1.3"
atomic_float = "1.1.0"
crossbeam-utils = "0.8.23"
enum_dispatch = "0.3"
auto_impl = "1.3"
triple_buffer = "9.0.0"
midir = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "synth_engine"
harness = false
