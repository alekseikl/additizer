[package]
name = "addi-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
addi-dsp = { path = "../addi-dsp" }
auto_impl = "1.3"
enum_dispatch = "0.3"
itertools = "0.15.0"
rand = "0.10.2"
