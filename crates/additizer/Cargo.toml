[package]
name = "additizer"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
addi-dsp = { workspace = true }
addi-egui = { path = "../addi-egui" }
addi-engine = { workspace = true }
addi-ui-backend = { workspace = true }
egui = { workspace = true }
nice-plug = { path = "../../third_party/nice-plug/crates/nice-plug", features = [
    "standalone",
    "tracing-subscriber",
] }
nice-plug-egui = { path = "../../third_party/nice-plug/crates/nice-plug-egui", default-features = false, features = [
    "opengl",
] }
parking_lot = { workspace = true, features = ["serde"] }
assert_no_alloc = "1.1.2"
const_format = "0.2.36"
crossbeam-utils = "0.8.23"
midir = "0.11"
