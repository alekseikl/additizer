[package]
name = "addi-ui-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
addi-dsp = { path = "../addi-dsp" }
addi-engine = { path = "../addi-engine" }
arc-swap = "1.9.2"
atomic_float = "1.1.0"
auto_impl = "1.3"
directories = "6.0.0"
enum_dispatch = "0.3"
parking_lot = { version = "0.12.5", features = ["serde"] }
rtrb = "0.4.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tracing = "0.1.41"
triple_buffer = "9.0.0"
